<header>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="{{ if eq .Site.Language.Lang "ar" }}/ar/{{ else }}/{{ end }}" class="logo-link" title="Naswell Stories Home">
                <img src="/images/naswell-logo.png" alt="Naswell Stories" class="site-logo">
            </a>
            
            <div class="nav-links">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}">{{ .Name }}</a>
                {{ end }}
                
                <!-- Dark Mode Toggle -->
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
                
                <!-- Language Switcher -->
                {{ if .IsTranslated }}
                <div class="lang-switch">
                    {{ range .Translations }}
                    <a href="{{ .Permalink }}" title="{{ .Language.LanguageName }}">
                        {{ if eq .Language.Lang "ar" }}🇦🇪 العربية{{ else }}🇬🇧 EN{{ end }}
                    </a>
                    {{ end }}
                </div>
                {{ end }}
            </div>
        </div>
    </nav>
</header>

<script>
// Dark mode toggle
const themeToggle = document.getElementById('theme-toggle');
const html = document.documentElement;
const themeIcon = themeToggle.querySelector('.theme-icon');

// Load saved theme or default to light
const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

themeToggle.addEventListener('click', () => {
  const currentTheme = html.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
});
</script>

<style>
.theme-toggle {
  background: none;
  border: 2px solid var(--text-primary, #2d2d2d);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 1.2rem;
  margin-left: 1rem;
}

.theme-toggle:hover {
  transform: scale(1.1);
  background: var(--bg-hover, rgba(0,0,0,0.05));
}

[data-theme="dark"] .theme-toggle {
  border-color: var(--text-primary);
}

[data-theme="dark"] .theme-toggle:hover {
  background: rgba(255,255,255,0.1);
}
</style>
