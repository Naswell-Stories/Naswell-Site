baseURL = "/"
defaultContentLanguage = "en"
title = "Naswell – Stories & Coaching"
theme = "PaperMod"
publishDir = "docs"
enableRobotsTXT = true
googleAnalytics = "G-1PMB8PYWNJ"
relativeURLs = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content"
    languageCode = "en-us"
    
  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content/ar"
    languageCode = "ar"
    languageDirection = "rtl"

[languages.en.params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[languages.ar.params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.assets]
  disableFingerprinting = true
  disableHLJS = true

[pagination]
  pagerSize = 10

