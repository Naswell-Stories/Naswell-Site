baseURL = "/"
defaultContentLanguage = "en"
title = "Naswell – Stories & Coaching"
theme = "PaperMod"
publishDir = "docs"
enableRobotsTXT = true
googleAnalytics = "G-1PMB8PYWNJ"
relativeURLs = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content"
    languageCode = "en-us"
    
  [languages.ar]
    languageName = "العربية"
    weight = 2
    contentDir = "content/ar"
    languageCode = "ar"
    languageDirection = "rtl"

[languages.en.params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[languages.ar.params]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.assets]
  disableFingerprinting = true
  disableHLJS = true

# Footer social icons are hidden from view until the accounts are fully activated.
# The links themselves stay defined in layouts/partials/footer.html - just flip
# this to true when ready to show them again.
[params.display]
  socialLinksVisible = false

[pagination]
  pagerSize = 10

